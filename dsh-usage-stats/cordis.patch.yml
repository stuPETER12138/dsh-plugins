# Usage Stats bundle: one row. The Host half folds this machine's stored session
# logs into token/cost figures and serves one loopback JSON route; the browser
# half registers the left-sidebar entry and its panel.
#
# Optional `config`:
#   prices     USD per 1M tokens, keyed "provider/model" or bare "model"; an entry
#              replaces the shipped entry with the same key (all four rates)
#   fallback   rates for any model the table does not name
- insert:
    - id: usage-stats
      name: '@local/dsh-usage-stats'
      config: {}
