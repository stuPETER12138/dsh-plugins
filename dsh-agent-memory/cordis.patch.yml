# Agent memory bundle: one row. The Host half owns `core.md` and
# `records.jsonl`, serves the panel over a loopback route, stages what
# `/memory <query>` retrieves, and delivers a staged block as dynamic prompt
# context on the next request; the browser half registers the left-sidebar entry
# and its three-pane page.
#
# Optional `config`:
#   dir       folder holding core.md, records.jsonl, dismissed.json
#             (default `<harness home>/agent-memory`)
#   maxChars  character cap for the core block and for one record
#             (default 8000, clamped to 500..50000)
- insert:
    - id: agent-memory
      name: '@local/dsh-agent-memory'
      config: {}
